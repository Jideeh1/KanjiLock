@font-face{font-family:Inter;src:url(inter.ttf);font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:Inter,'Noto Sans CJK JP',sans-serif;color:#EDF3F3;-webkit-font-smoothing:antialiased}
.jp{font-family:'Noto Sans CJK JP',Inter,sans-serif}
#world{position:absolute;inset:0;overflow:hidden}
.shot{position:absolute;inset:0;overflow:hidden;display:none}
.full{position:absolute;inset:0}
.kt{position:absolute;font-weight:900;text-transform:uppercase;letter-spacing:-5px;line-height:.86;white-space:nowrap;will-change:transform}
.outl{color:transparent;-webkit-text-stroke:3px currentColor}
.marq{position:absolute;left:0;white-space:nowrap;font-weight:900;text-transform:uppercase;letter-spacing:-3px}
/* phone */
.rig{position:absolute;width:440px;height:910px;transform-style:preserve-3d}
.slab{position:absolute;inset:0;border-radius:64px;background:linear-gradient(90deg,#3A4A4D,#141c1e 40%,#2C3A3D)}

.cam{position:absolute;top:18px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#050a0b;z-index:5}
.glint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 47%,rgba(255,255,255,.05) 53%,transparent 62%);background-size:300% 100%;z-index:60}
.kick{font-size:12px;letter-spacing:1.6px;font-weight:600;color:#93A6A8;text-transform:uppercase}
.ttl{font-size:44px;font-weight:500;margin-top:4px;letter-spacing:-.5px}
.sub{font-size:17px;color:#93A6A8;margin-top:4px}
.card{background:rgba(42,66,71,.55);border-radius:22px;border:1px solid rgba(255,255,255,.06)}
.nav{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:10px;background:rgba(10,18,20,.55);padding:8px;border-radius:22px}
.nav i{width:50px;height:50px;border-radius:15px;background:rgba(42,66,71,.8);display:block}
.nav i.on{background:#EDF3F3}
.btnc{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lbl{font-size:15px;color:#C9D6D7;margin-top:8px;text-align:center}
.pill{background:#EDF3F3;color:#111D20;border-radius:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.touch{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.75);opacity:0;z-index:50}
.row{display:flex;align-items:center;gap:14px;padding:14px;margin-top:10px}
.kbox{width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.tag{font-size:11px;letter-spacing:1.4px;color:#93A6A8;font-weight:600}
.mean{font-size:17px;margin-top:3px;line-height:1.25}
.wid{position:absolute;background:rgba(24,38,41,.97);border-radius:36px;box-shadow:0 40px 80px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08)}
.game{position:absolute;width:560px;height:400px;border-radius:36px;padding:38px;background:#1C2F33;border:1px solid rgba(255,255,255,.1);box-shadow:0 40px 80px rgba(0,0,0,.45)}
.game .gt{font-size:42px;font-weight:800;margin-top:6px}
.opt{display:inline-block;padding:12px 20px;border-radius:14px;background:rgba(255,255,255,.08);font-size:22px;margin:0 10px 10px 0}
.burst{position:absolute;width:0;height:0;z-index:70}
.burst i{position:absolute;display:block;border-radius:50%}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

// ---------- master render ----------
const IRIS_D=0.32, SLICE_D=0.28;
function render(t){
  const tb=t/B;
  SH.forEach((s,i)=>{
    const a=s[0]*B,b=s[1]*B,sh=$('sh'+i),D=b-a,lt=t-a;
    const next=SH[i+1];const tail=next&&next[3]==='iris'?IRIS_D:next&&next[3]==='slice'?SLICE_D:0;
    if(t<a||t>=b+tail){sh.style.display='none';return}
    sh.style.display='block';
    let tr='',filt='',clip='none',op=1,mb=0;
    // entry
    if(s[3]==='iris'){const p=eio(k(lt,0,IRIS_D));clip=`circle(${p*1200}px at 50% 50%)`}
    if(s[3]==='slice'){const p=eio(k(lt,0,SLICE_D));const x=lerp(-700,2620,p);clip=`polygon(${x-700}px 0,${x+300}px 0,${x-300}px 1080px,${x-1300}px 1080px)`;if(p>=1)clip='none';else clip=`polygon(0 0,${x+300}px 0,${x-300}px 1080px,0 1080px)`}
    if(s[3]==='whip'){const p=k(lt,0,0.18);tr+=`translateX(${(1-ex(p))*1900}px) `;mb=Math.max(mb,(1-p)*120)}
    if(s[3]==='zoom'){const p=k(lt,0,0.25);tr+=`scale(${lerp(0.4,1,ex(p))}) `;op=Math.min(op,cl(p*3));mb=0;filt+=`blur(${(1-ex(p))*20}px) `}
    // exit
    const lo=t-b+0.16;
    if(s[4]==='whip'&&lo>0){const p=k(lo,0,0.16);tr+=`translateX(${-ex(p)*1900}px) `;mb=Math.max(mb,p*120)}
    if(s[4]==='zoom'&&lo>0){const p=k(lo,0,0.16);tr+=`scale(${1+3*p*p}) `;op=Math.min(op,1-p);filt+=`blur(${p*20}px) `}
    sh.style.clipPath=clip;sh.style.opacity=op;sh.style.transform=tr||'';
    $('mbg'+i).setAttribute('stdDeviation',`${mb.toFixed(1)} 0`);
    sh.style.filter=(mb>0.5?`url(#mb${i}) `:'')+filt||'none';
    R[i](Math.min(lt,D+tail),D);
    if(i===3){}
  });
  // camera shake + rgb
  let sx=0,sy=0,rg=0;
  HITS.forEach(h=>{const dt=t-h*B;if(dt>=0&&dt<0.5){const a=Math.exp(-dt*14);sx+=a*22*Math.sin(dt*90+h);sy+=a*16*Math.cos(dt*77+h*3);rg+=a*16}});
  W.style.transform=`translate(${sx}px,${sy}px) rotate(${sx*0.03}deg)`;
  $('rdx').setAttribute('dx',rg.toFixed(1));$('bdx').setAttribute('dx',(-rg).toFixed(1));
  W.style.filter=rg>0.6?'url(#rgb)':'none';
  let fl=0;FLASH.forEach(([h,a])=>{const dt=t-h*B;if(dt>=0)fl=Math.max(fl,a*Math.exp(-dt*9))});$('flash').style.opacity=fl;
  $('turb').setAttribute('seed',Math.floor(t*30)%17+1);
}
window.render=render;
